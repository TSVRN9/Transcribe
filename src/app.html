<!doctype html>
<html lang="en">
	<head>
		<meta name="viewport" content="width=device-width,initial-scale=1" />
		<meta name="description" content="Transcribe audio easier!" />
		<meta name="theme-color" content="#020617" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta charset="utf-8" />
		<title>Transcribe</title>
		<link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" sizes="180x180" />
		<link rel="mask-icon" href="%sveltekit.assets%/pwa-512x512.png" color="#000000" />
		<link rel="icon" href="%sveltekit.assets%/favicon.png" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&display=swap"
			rel="stylesheet"
		/>
		%sveltekit.head%
	</head>
	<body
		data-sveltekit-preload-data="hover"
		class="bg-stone-950 text-stone-100 min-h-screen antialiased"
	>
		<!-- no <main> wrapper here — the route itself provides one (+page.svelte); a second one
		     around the page body was an invalid nested landmark every route inherited, including
		     ones (like share-target) that don't render their own. Do not write the literal
		     sveltekit-body placeholder token inside this comment — SvelteKit's template
		     processing does a raw string substitution over the whole file, comments included,
		     and will splice real page HTML into the middle of it. -->
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
