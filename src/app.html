<!doctype html>
<html lang="en">
	<head>
		<meta name="viewport" content="width=device-width,initial-scale=1" />
		<meta
			name="description"
			content="Slow down, loop and see the pitches of any recording while you transcribe it."
		/>
		<meta name="theme-color" content="#f3f5f4" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#121821" media="(prefers-color-scheme: dark)" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta charset="utf-8" />
		<title>Transcribe</title>
		<link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" sizes="180x180" />
		<link rel="mask-icon" href="%sveltekit.assets%/pwa-512x512.png" color="#000000" />
		<link rel="icon" href="%sveltekit.assets%/favicon.png" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&display=swap"
			rel="stylesheet"
		/>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover" class="bg-paper text-ink min-h-screen antialiased">
		<!-- never write the body placeholder token in a comment: SvelteKit substitutes it anywhere -->
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
